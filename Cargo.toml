[workspace]
members = [
    "rust/lancedb",
    "rust/lancedb-wasm",
    "vendor/lance-core",
    "vendor/lance-file",
    "vendor/lance-io",
    "nodejs",
    "python",
    "vendor/lance-encoding",
    "vendor/lance-table",
]
# Python package needs to be built by maturin.
exclude = ["python"]
resolver = "2"

[workspace.package]
version = "4.0.0-rc.3"
edition = "2024"
authors = ["LanceDB Devs <dev@lancedb.com>"]
license = "Apache-2.0"
repository = "https://github.com/lancedb/lancedb"
readme = "README.md"
description = "Serverless, low-latency vector database for AI applications"
keywords = ["lancedb", "lance", "database", "vector", "search"]
categories = ["database-implementations"]
rust-version = "1.91.0"

[workspace.dependencies]
lance = { "version" = "=4.0.0-rc.3", default-features = false, "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-core = { "version" = "=4.0.0-rc.3", "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-datagen = { "version" = "=4.0.0-rc.3", "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-file = { "version" = "=4.0.0-rc.3", "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-io = { "version" = "=4.0.0-rc.3", default-features = false, "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-index = { "version" = "=4.0.0-rc.3", "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-linalg = { "version" = "=4.0.0-rc.3", "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-namespace = { "version" = "=4.0.0-rc.3", "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-namespace-impls = { "version" = "=4.0.0-rc.3", default-features = false, "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-table = { "version" = "=4.0.0-rc.3", "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-testing = { "version" = "=4.0.0-rc.3", "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-datafusion = { "version" = "=4.0.0-rc.3", "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-encoding = { "version" = "=4.0.0-rc.3", "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
lance-arrow = { "version" = "=4.0.0-rc.3", "tag" = "v4.0.0-rc.3", "git" = "https://github.com/lance-format/lance.git" }
ahash = "0.8"
# Note that this one does not include pyarrow
arrow = { version = "57.2", optional = false }
arrow-arith = "57.2"
arrow-array = "57.2"
arrow-buffer = "57.2"
arrow-data = "57.2"
arrow-ipc = "57.2"
arrow-ord = "57.2"
arrow-schema = "57.2"
arrow-select = "57.2"
arrow-cast = "57.2"
async-recursion = "1.0"
async-trait = "0"
aws-config = "1.2.0"
aws-credential-types = "1.2.0"
aws-sdk-dynamodb = { version = "1.38.0", default-features = false }
bytemuck = { version = "1.14", features = ["extern_crate_alloc"] }
byteorder = "1.5"
bytes = "1.11.1"
datafusion = { version = "52.1", default-features = false }
datafusion-catalog = "52.1"
datafusion-common = { version = "52.1", default-features = false }
datafusion-execution = "52.1"
datafusion-expr = "52.1"
datafusion-functions = "52.1"
datafusion-physical-plan = "52.1"
datafusion-physical-expr = "52.1"
datafusion-sql = "52.1"
deepsize = "0.2.0"
criterion = { version = "0.5", features = ["async", "async_tokio", "html_reports"] }
env_logger = "0.11"
fsst = { version = "=4.0.0-rc.3", tag = "v4.0.0-rc.3", git = "https://github.com/lance-format/lance.git", package = "fsst" }
half = { "version" = "2.7.1", default-features = false, features = [
    "num-traits",
] }
futures = "0"
hex = "0.4.3"
http = "1.1.0"
hyperloglogplus = { version = "0.4.1", features = ["const-loop"] }
itertools = "0.13"
libc = "0.2.176"
log = "0.4"
lance-bitpacking = { version = "=4.0.0-rc.3", tag = "v4.0.0-rc.3", git = "https://github.com/lance-format/lance.git", package = "lance-bitpacking" }
mock_instant = "0.6.0"
mockall = "0.13.1"
moka = { version = "0.12", features = ["future"] }
num_cpus = "1.0"
object_store = "0.12.0"
object_store_opendal = "0.55"
opendal = "0.55"
path_abs = "0.5"
pin-project = "1.0.7"
pprof = { version = "0.14.0", features = ["flamegraph", "criterion"] }
pretty_assertions = "1.4.0"
proptest = "1.3.1"
prost = "0.14.1"
prost-build = "0.14.1"
prost-types = "0.14.1"
rand = "0.9"
rangemap = "1.0"
roaring = "0.11"
rstest = "0.23.0"
serde = { version = "^1" }
serde_json = { version = "1" }
snafu = "0.8"
strum = "0.26"
tempfile = "3"
test-log = "0.2.15"
tokio = { version = "1.23", features = ["rt-multi-thread", "macros", "fs", "sync"] }
tokio-stream = "0.1.14"
tokio-util = "0.7.16"
tracing = "0.1"
tracing-mock = "=0.1.0-beta.3"
url = "2"
uuid = { version = "1.2", features = ["js", "v4", "serde"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
num-traits = "0.2"
regex = "1.10"
lazy_static = "1"
semver = "1.0.25"
chrono = "0.4"

[patch."https://github.com/lance-format/lance.git"]
lance-core = { path = "vendor/lance-core" }
lance-file = { path = "vendor/lance-file" }
lance-io = { path = "vendor/lance-io" }
lance-encoding = { path = "vendor/lance-encoding" }
lance-table = { path = "vendor/lance-table" }

[patch.crates-io]
path_abs = { path = "vendor/path_abs" }

[profile.ci]
debug = "line-tables-only"
inherits = "dev"
incremental = false

# This rule applies to every package except workspace members (dependencies
# such as `arrow` and `tokio`). It disables debug info and related features on
# dependencies so their binaries stay smaller, improving cache reuse.
[profile.ci.package."*"]
debug = false
debug-assertions = false
strip = "debuginfo"
incremental = false

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage,coverage_nightly)'] }
unsafe_op_in_unsafe_fn = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
fallible_impl_from = "deny"
manual_let_else = "deny"
redundant_pub_crate = "deny"
string_add_assign = "deny"
string_add = "deny"
string_lit_as_bytes = "deny"
use_self = "deny"
dbg_macro = "deny"
trait_duplication_in_bounds = "deny"
redundant_clone = "deny"
print_stdout = "deny"
print_stderr = "deny"
multiple-crate-versions = "allow"
single_range_in_vec_init = "allow"
large_futures = "deny"
disallowed_macros = "deny"
