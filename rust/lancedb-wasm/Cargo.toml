[package]
name = "lancedb-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only HTTP search bindings for LanceDB tables"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
async-trait.workspace = true
futures.workspace = true
http = "1"
lance.workspace = true
lance-core.workspace = true
lance-index.workspace = true
lance-io.workspace = true
lance-table.workspace = true
lancedb = { path = "../lancedb" }
object_store = { workspace = true, features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.115"
wasm-bindgen-futures = "0.4.55"

[dev-dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
axum = "0.8.4"
tempfile = "3.23.0"
tokio = { version = "1.23", features = ["macros", "rt-multi-thread", "sync", "net"] }
tower-http = { version = "0.6.6", features = ["fs"] }
