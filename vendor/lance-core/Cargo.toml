[package]
name = "lance-core"
version = "5.1.0-beta.3"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Lance Columnar Format -- Core Library"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
lance-arrow.workspace = true
byteorder.workspace = true
bytes.workspace = true
chrono.workspace = true
datafusion-common = { workspace = true, optional = true }
datafusion-sql = { workspace = true, optional = true }
deepsize.workspace = true
futures.workspace = true
itertools.workspace = true
libc.workspace = true
mock_instant.workspace = true
moka.workspace = true
num_cpus = "1.0"
object_store = { workspace = true }
pin-project.workspace = true
prost.workspace = true
rand.workspace = true
roaring.workspace = true
serde_json.workspace = true
snafu = "0.9"
tracing.workspace = true
url.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.23", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-stream = { version = "0.1.14", default-features = false }
tokio-util = { version = "0.7.16", default-features = false, features = ["rt"] }

# This is used to detect CPU features at runtime.
# See src/utils/cpu.rs
[target.'cfg(all(any(target_arch = "aarch64", target_arch = "loongarch64"), target_os = "linux"))'.dependencies]
libc = { version = "0.2" }

[dev-dependencies]
lance-testing.workspace = true
proptest.workspace = true
rstest.workspace = true

[features]
datafusion = ["dep:datafusion-common", "dep:datafusion-sql"]

[lints]
workspace = true
