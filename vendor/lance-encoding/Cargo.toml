[package]
name = "lance-encoding"
version = "4.0.0-rc.3"
edition = "2024"
authors = ["Lance Devs <dev@lance.org>"]
license = "Apache-2.0"
repository = "https://github.com/lance-format/lance"
readme = "README.md"
description = "Encoders and decoders for the Lance file format"
keywords = [
    "data-format",
    "data-science",
    "machine-learning",
    "apache-arrow",
    "data-analytics",
]
categories = [
    "database-implementations",
    "data-structures",
    "development-tools",
    "science",
]
rust-version = "1.91.0"

[dependencies]
lance-arrow.workspace = true
lance-core.workspace = true
arrow-arith.workspace = true
arrow-array.workspace = true
arrow-data.workspace = true
arrow-buffer.workspace = true
arrow-cast.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
lance-bitpacking = { workspace = true, optional = true }
bytes.workspace = true
futures.workspace = true
fsst.workspace = true
hex.workspace = true
itertools.workspace = true
log.workspace = true
num-traits.workspace = true
prost.workspace = true
hyperloglogplus.workspace = true
prost-types.workspace = true
rand.workspace = true
snafu = "0.9"
strum = { workspace = true, features = ["derive"] }
tracing.workspace = true
xxhash-rust.workspace = true
bytemuck.workspace = true
byteorder.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
lz4 = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.23", default-features = false, features = ["io-util", "macros", "rt", "sync", "time"] }
lz4 = { package = "lz4_flex", version = "0.12", optional = true }
zstd = { package = "ruzstd", version = "0.8.2", optional = true }

[build-dependencies]
prost-build.workspace = true
protobuf-src = { version = "2.1", optional = true }

[features]
default = ["lz4", "zstd", "bitpacking"]
protoc = ["dep:protobuf-src"]
bitpacking = ["dep:lance-bitpacking"]
lz4 = ["dep:lz4"]
zstd = ["dep:zstd"]

[package.metadata.docs.rs]
features = ["protoc"]
